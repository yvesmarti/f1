# Project-wide Gradle settings.
# AndroidX is mandatory for modern AndroidX-backed libraries.
android.useAndroidX=true
# Kotlin official code style (used by IDE formatter).
kotlin.code.style=official
# Heap size — sufficient for AGP 8.x without slowing down CI boxes.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Faster incremental builds for Kotlin.
kotlin.incremental=true
# Enable Gradle parallel project execution where possible.
org.gradle.parallel=true
# Suppress the unsupported-compileSdk warning on intermediate SDKs.
android.suppressUnsupportedCompileSdk=34
